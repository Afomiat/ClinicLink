<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClinicLink – Patient Portal</title>

    <style>
      /* ── CSS variables pre-defined so layout never shifts on hydration ── */
      :root {
        --bg-primary:         #f8f9ff;
        --sidebar-bg:         #ffffff;
        --sidebar-text:       #64748b;
        --sidebar-text-active:#0f172a;
        --white:              #ffffff;
        --accent:             #119c89;
        --text-color:         #0f172a;
        --bullet-color:       #119c89;
        --icon-color:         #119c89;
        --calanderday:        #000000;
        --active-text:        #000000;
        --active-nav-bag:     #f1f5f9;
        --card-bg:            #ffffff;
      }

      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        vertical-align: middle;
        font-size: inherit;
      }

      body {
        margin: 0;
        padding: 0;
        background: #f8f9ff;
        font-family: 'Inter', sans-serif;
      }

      /* ═══════════════════════════════════════════════
         LOADER OVERLAY
      ═══════════════════════════════════════════════ */
      #cl-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #edfaf7 0%, #f8f9ff 60%, #eaf5f3 100%);
        transition: opacity 0.55s cubic-bezier(0.4,0,0.2,1),
                    transform 0.55s cubic-bezier(0.4,0,0.2,1);
      }
      #cl-loader.fade-out {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }

      /* Centered content column */
      .cl-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
        position: relative;
      }

      /* Radial ambient glow */
      .cl-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 340px;
        height: 340px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle at center,
          rgba(17,156,137,0.13) 0%,
          transparent 68%);
        animation: cl-glow-breathe 2.8s ease-in-out infinite;
        pointer-events: none;
      }

      /* ── Brand ── */
      .cl-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        position: relative;
        z-index: 2;
        animation: cl-enter 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
      }

      .cl-logo {
        width: 66px;
        height: 66px;
        border-radius: 20px;
        display: block;
        box-shadow:
          0 18px 48px rgba(17,156,137,0.38),
          0 4px 14px rgba(17,156,137,0.18);
        animation: cl-logo-float 3.2s ease-in-out infinite;
        user-select: none;
      }

      .cl-name {
        font-size: 23px;
        font-weight: 800;
        color: #0f172a;
        letter-spacing: -0.4px;
        font-family: 'Manrope', 'Inter', sans-serif;
        line-height: 1;
      }

      .cl-tagline {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #119c89;
        opacity: 0.6;
        font-family: 'Inter', sans-serif;
        margin-top: -2px;
      }

      /* ═══════════════════════════════════════════════
         ORBITING DOTS — perfect circle via arm pattern

         Each .cl-arm is a zero-size div at the center,
         rotated N×45°. The .cl-dot inside is pushed
         outward with translateY(-radius). The whole
         .cl-spinner wrapper rotates to create orbit.
      ═══════════════════════════════════════════════ */
      .cl-spinner {
        position: relative;
        width: 110px;
        height: 110px;
        z-index: 2;
        animation: cl-spin 2.6s linear infinite;
      }

      /* Zero-size pivot at the spinner center */
      .cl-arm {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
      }

      /* Angle each arm around the clock */
      .cl-arm:nth-child(1) { transform: rotate(  0deg); }
      .cl-arm:nth-child(2) { transform: rotate( 45deg); }
      .cl-arm:nth-child(3) { transform: rotate( 90deg); }
      .cl-arm:nth-child(4) { transform: rotate(135deg); }
      .cl-arm:nth-child(5) { transform: rotate(180deg); }
      .cl-arm:nth-child(6) { transform: rotate(225deg); }
      .cl-arm:nth-child(7) { transform: rotate(270deg); }
      .cl-arm:nth-child(8) { transform: rotate(315deg); }

      /* Each dot is a circle pushed along that arm */
      .cl-dot {
        position: absolute;
        border-radius: 50%;
        /* Center the dot on the arm tip */
        transform: translateY(-44px) translateX(-50%);
        animation: cl-pulse 1.6s ease-in-out infinite;
      }

      /* Dot sizes, colors and delays — teal palette */
      .cl-arm:nth-child(1) .cl-dot {
        width: 16px; height: 16px;
        background: #119c89;
        box-shadow: 0 0 12px 3px rgba(17,156,137,0.55);
        animation-delay: 0.00s;
      }
      .cl-arm:nth-child(2) .cl-dot {
        width: 12px; height: 12px;
        background: #1bbda8;
        box-shadow: 0 0 9px 2px rgba(27,189,168,0.48);
        animation-delay: 0.20s;
      }
      .cl-arm:nth-child(3) .cl-dot {
        width: 14px; height: 14px;
        background: #0d7a6b;
        box-shadow: 0 0 10px 2px rgba(13,122,107,0.5);
        animation-delay: 0.40s;
      }
      .cl-arm:nth-child(4) .cl-dot {
        width: 10px; height: 10px;
        background: #5ee8d3;
        box-shadow: 0 0 8px 2px rgba(94,232,211,0.45);
        animation-delay: 0.60s;
      }
      .cl-arm:nth-child(5) .cl-dot {
        width: 18px; height: 18px;
        background: #119c89;
        box-shadow: 0 0 14px 4px rgba(17,156,137,0.55);
        animation-delay: 0.80s;
      }
      .cl-arm:nth-child(6) .cl-dot {
        width: 11px; height: 11px;
        background: #34d4bc;
        box-shadow: 0 0 8px 2px rgba(52,212,188,0.45);
        animation-delay: 1.00s;
      }
      .cl-arm:nth-child(7) .cl-dot {
        width: 13px; height: 13px;
        background: #0a5f53;
        box-shadow: 0 0 9px 2px rgba(10,95,83,0.45);
        animation-delay: 1.20s;
      }
      .cl-arm:nth-child(8) .cl-dot {
        width: 9px; height: 9px;
        background: #24c9b1;
        box-shadow: 0 0 7px 2px rgba(36,201,177,0.4);
        animation-delay: 1.40s;
      }

      /* ── Status label ── */
      .cl-label {
        font-size: 12.5px;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 0.1em;
        font-family: 'Inter', sans-serif;
        margin: 0;
        position: relative;
        z-index: 2;
        animation: cl-fade-cycle 2s ease-in-out infinite;
      }

      /* ── Bottom shimmer bar ── */
      .cl-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        width: 0;
        background: linear-gradient(90deg, #119c89, #5ee8d3, #119c89);
        background-size: 300% 100%;
        animation:
          cl-bar-grow    2s ease-out forwards,
          cl-bar-shimmer 1.4s linear infinite 0.3s;
      }

      /* ═══════════════════════════════════════
         KEYFRAMES
      ═══════════════════════════════════════ */
      @keyframes cl-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes cl-pulse {
        0%, 100% { opacity: 0.18; transform: translateY(-44px) translateX(-50%) scale(0.65); }
        50%       { opacity: 1;   transform: translateY(-44px) translateX(-50%) scale(1.18); }
      }

      @keyframes cl-enter {
        from { opacity: 0; transform: translateY(18px) scale(0.9); }
        to   { opacity: 1; transform: translateY(0)    scale(1);   }
      }

      @keyframes cl-logo-float {
        0%, 100% { transform: translateY(0);   }
        50%       { transform: translateY(-7px); }
      }

      @keyframes cl-glow-breathe {
        0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1);    }
        50%       { opacity: 1;  transform: translate(-50%,-50%) scale(1.15); }
      }

      @keyframes cl-fade-cycle {
        0%, 100% { opacity: 0.3; }
        50%       { opacity: 0.85; }
      }

      @keyframes cl-bar-grow {
        from { width: 0;   }
        to   { width: 82%; }
      }

      @keyframes cl-bar-shimmer {
        from { background-position: 200% 0; }
        to   { background-position: -200% 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .cl-spinner, .cl-logo, .cl-glow { animation: none; }
        .cl-dot  { animation: none; opacity: 0.75; }
        .cl-label{ animation: none; }
        .cl-bar  { animation: none; width: 55%; }
      }
    </style>

    <!-- Google Fonts: Manrope + Inter (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <!--
      Expose window.clDismissLoader() so React can signal readiness.
      The loader stays up until App.jsx calls this after its first useEffect.
    -->
    <script>
      (function () {
        var MIN_MS  = 1600;   // always show at least 1.6 s of animation
        var startTs = Date.now();
        var called  = false;

        function runDismiss() {
          if (called) return;
          called = true;
          var loader  = document.getElementById('cl-loader');
          if (!loader) return;
          var elapsed = Date.now() - startTs;
          var delay   = Math.max(0, MIN_MS - elapsed);
          setTimeout(function () {
            loader.classList.add('fade-out');
            loader.addEventListener('transitionend', function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, { once: true });
          }, delay);
        }

        // React calls this after its first useEffect (post-paint)
        window.clDismissLoader = runDismiss;

        // Hard fallback — removes loader even if React errors out
        setTimeout(runDismiss, 8000);
      })();
    </script>
  </head>

  <body>
    <!-- ═══════════════════════════════════════════
         Loader — visible immediately, before JS runs
    ═══════════════════════════════════════════ -->
    <div id="cl-loader" role="status" aria-label="Loading ClinicLink">
      <div class="cl-card">
        <!-- Ambient glow -->
        <div class="cl-glow" aria-hidden="true"></div>

        <!-- Brand -->
        <div class="cl-brand">
          <img
            src="/logo.svg"
            alt="ClinicLink Logo"
            class="cl-logo"
            width="66"
            height="66"
            draggable="false"
          />
          <span class="cl-name">ClinicLink</span>
          <span class="cl-tagline">Premium Portal</span>
        </div>

        <!-- Orbiting dots wheel: 8 arms, each holds 1 dot -->
        <div class="cl-spinner" aria-hidden="true">
          <div class="cl-arm"><div class="cl-dot"></div></div>
          <div class="cl-arm"><div class="cl-dot"></div></div>
          <div class="cl-arm"><div class="cl-dot"></div></div>
          <div class="cl-arm"><div class="cl-dot"></div></div>
          <div class="cl-arm"><div class="cl-dot"></div></div>
          <div class="cl-arm"><div class="cl-dot"></div></div>
          <div class="cl-arm"><div class="cl-dot"></div></div>
          <div class="cl-arm"><div class="cl-dot"></div></div>
        </div>

        <p class="cl-label">Preparing your portal&hellip;</p>
      </div>

      <!-- Bottom shimmer progress bar -->
      <div class="cl-bar" aria-hidden="true"></div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/appear/1.0.3/appear.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/circles.js@0.0.6/circles.min.js"></script>
  </body>
</html>
