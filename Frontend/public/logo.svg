<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#119c89"/>
      <stop offset="100%" stop-color="#0a6e5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(17,156,137,0.4)"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16"
        fill="url(#logoGrad)" filter="url(#shadow)"/>

  <!-- White highlight overlay -->
  <rect x="2" y="2" width="60" height="28" rx="16" ry="16"
        fill="rgba(255,255,255,0.08)"/>

  <!-- Stethoscope icon (scaled to fit 64×64, centered) -->
  <!-- Earpiece tubes -->
  <path d="M22 14 L22 24 Q22 30 28 30 L36 30 Q42 30 42 24 L42 14"
        fill="none" stroke="white" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tube down from chest-piece -->
  <line x1="32" y1="30" x2="32" y2="38"
        stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Chest-piece circle -->
  <circle cx="32" cy="46" r="6.5"
          fill="none" stroke="white" stroke-width="3.5"/>
  <!-- Small dot inside chest-piece -->
  <circle cx="32" cy="46" r="2" fill="white"/>
</svg>
